[package]
name = "roosta"
version = "0.1.0"
description = "Roosta - Rotating Savings and Credit Association (ROSCA) protocol on Solana"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "roosta"

[features]
default = []
no-entrypoint = []
no-idl = []
no-log-ix-name = []
cpi = ["no-entrypoint"]
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build"]

[dependencies]
anchor-lang = { version = "0.31.1", features = ["init-if-needed"] }
anchor-spl = { version = "0.31.1", features = ["metadata", "associated_token", "token", "token_2022", "token_2022_extensions"] }
